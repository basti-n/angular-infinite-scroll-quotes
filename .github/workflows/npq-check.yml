name: Weekly NPQ Dependency Check

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at 00:00 UTC
  workflow_dispatch: # Allow manual runs

jobs:
  npq-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install NPQ globally
        run: npm install -g npq

      - name: Run NPQ scan
        run: npq scan --summary

      - name: Post concise summary
        if: always()
        run: |
          echo "🧠 NPQ dependency scan completed!"
          echo "Check the logs above for risky or suspicious packages."
